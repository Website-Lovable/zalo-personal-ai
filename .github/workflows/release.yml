# Build and publish production images to GHCR once CI is green on main (or on a v* tag).
# Tags: sha-<short sha> (what deploy.yml deploys), main, and the version for v* tags.
# Publishing an image changes nothing in production: deploying is a separate, approved step.
name: Release images

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  images:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: zalo-personal-ai
            context: .
            build_args: INSTALL_DEV=false
          - name: zalo-personal-sidecar
            context: sidecar/zalo-personal
            build_args: ""
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - id: meta
        run: |
          sha="${{ github.event.workflow_run.head_sha || github.sha }}"
          owner="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          image="ghcr.io/$owner/${{ matrix.name }}"
          tags="$image:sha-${sha::7}"
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then tags="$tags,$image:${GITHUB_REF#refs/tags/}"; else tags="$tags,$image:main"; fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "tags=$tags" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            ${{ matrix.build_args }}
            GIT_SHA=${{ steps.meta.outputs.sha }}
          labels: org.opencontainers.image.revision=${{ steps.meta.outputs.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
