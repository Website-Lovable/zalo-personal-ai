name: CI

on:
  push:
    branches: [main, "feature/**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "ruff>=0.11"
      - run: ruff check .
      - run: ruff format --check .

  sidecar:
    # Personal Zalo sidecar (zca-js, pinned). Tests use a fake Zalo, no network.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sidecar/zalo-personal
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm audit --omit=dev --audit-level=high

  test:
    # Unit + integration + end-to-end (tests/e2e) + query-budget (tests/perf) on PostgreSQL 16.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: zalo_ai
          POSTGRES_USER: zalo
          POSTGRES_PASSWORD: zalo
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U zalo -d zalo_ai"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://zalo:zalo@localhost:5432/zalo_ai
      DJANGO_SETTINGS_MODULE: config.settings.test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: python manage.py makemigrations --check --dry-run
      - run: pytest
      - name: Export OpenAPI schema
        run: python manage.py spectacular --file openapi.yaml --validate --fail-on-warn
      - uses: actions/upload-artifact@v4
        with:
          name: openapi-schema
          path: openapi.yaml

  security:
    # Phase 5: dependency CVEs + Django deployment checklist on the production settings.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements.txt "pip-audit>=2.7"
      - name: Known vulnerabilities in Python dependencies
        run: pip-audit -r requirements.txt --strict
      - name: Django deploy checklist (production settings, throwaway values)
        run: |
          export DJANGO_SETTINGS_MODULE=config.settings.production
          export SECRET_KEY="$(python -c 'import secrets; print(secrets.token_urlsafe(64))')"
          export JWT_SECRET_KEY="$(python -c 'import secrets; print(secrets.token_urlsafe(64))')"
          export ENCRYPTION_KEY="$(python -c 'from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())')"
          export DATABASE_URL=postgres://u:p@localhost:5432/x ALLOWED_HOSTS=zalo-ai.example.com
          python manage.py check --deploy --fail-level WARNING

  deploy-config:
    # Production images build, and every deployment/monitoring config file parses.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build app image (production, no dev tools)
        run: docker build --build-arg INSTALL_DEV=false --build-arg GIT_SHA=${{ github.sha }} -t zalo-personal-ai:ci .
      - name: Build sidecar image
        run: docker build -t zalo-personal-sidecar:ci sidecar/zalo-personal
      - name: Production image starts and passes checks
        run: |
          docker run --rm -e DJANGO_SETTINGS_MODULE=config.settings.production \
            -e SECRET_KEY="$(openssl rand -base64 48)" -e JWT_SECRET_KEY="$(openssl rand -base64 48)" \
            -e ENCRYPTION_KEY="$(python3 -c 'import base64,os; print(base64.urlsafe_b64encode(os.urandom(32)).decode())')" \
            -e DATABASE_URL=postgres://u:p@db:5432/x -e ALLOWED_HOSTS=zalo-ai.example.com \
            zalo-personal-ai:ci sh -c "python manage.py check --deploy --fail-level WARNING && ! pip show pytest >/dev/null 2>&1"
      - name: Compose file is valid
        run: |
          cp .env.production.example .env.production
          IMAGE_TAG=ci POSTGRES_PASSWORD=x DOMAIN=example.com ACME_EMAIL=a@example.com \
            docker compose -f docker-compose.prod.yml --profile monitoring --profile personal config -q
      - name: Caddyfile is valid
        run: |
          docker run --rm -e DOMAIN=example.com -e ACME_EMAIL=a@example.com \
            -v "$PWD/deploy/Caddyfile:/etc/caddy/Caddyfile:ro" caddy:2.10-alpine \
            caddy validate --config /etc/caddy/Caddyfile
      - name: Prometheus rules + Alertmanager config are valid
        run: |
          docker run --rm --entrypoint promtool -v "$PWD/deploy/monitoring:/m:ro" prom/prometheus:v3.5.0 check rules /m/alerts.yml
          docker run --rm --entrypoint promtool -v "$PWD/deploy/monitoring:/m:ro" prom/prometheus:v3.5.0 check config --syntax-only /m/prometheus.yml
          docker run --rm --entrypoint amtool -v "$PWD/deploy/monitoring:/m:ro" prom/alertmanager:v0.28.1 check-config /m/alertmanager.yml
      - name: Shell scripts parse
        run: for f in deploy/scripts/*.sh; do bash -n "$f"; done
