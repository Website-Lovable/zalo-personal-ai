# Prometheus for the production stack (profile "monitoring" in docker-compose.prod.yml).
# Put the same random value as METRICS_TOKEN (.env.production) into secrets/metrics_token.
global:
  scrape_interval: 30s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: zalo-ai
    metrics_path: /metrics/
    authorization:
      type: Bearer
      credentials_file: /etc/prometheus/secrets/metrics_token
    static_configs:
      - targets: ["web:8000"]

  - job_name: caddy
    static_configs:
      - targets: ["caddy:9180"]

  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
